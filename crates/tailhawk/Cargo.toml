[package]
name = "tailhawk"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tailhawk-core = { path = "../tailhawk-core" }
# `#[implement]` expands to paths rooted at `::windows_core` — the same crate `windows` re-exports as
# `windows::core`, so this is a name, not a second dependency.
windows-core = "0.58"

# The shell is the only crate allowed to own a window (`SPEC.md` §3.1), so it is the only place
# `SPEC.md` §3.2's device-removed recovery can be tested with a real swapchain attached. Under
# resolver 2 this does not switch the feature on for `cargo build`.
[dev-dependencies]
tailhawk-core = { path = "../tailhawk-core", features = ["test-hooks"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_DataExchange",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Com",
    "Win32_System_Variant",
    "implement",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemServices",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
