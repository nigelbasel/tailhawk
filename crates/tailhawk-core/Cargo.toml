[package]
name = "tailhawk-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `Renderer::simulate_device_loss`, so the shell's tests can drive `SPEC.md` §3.2's
# device-removed recovery against a real window and a real swapchain. D3D11 offers no way to
# remove a device on purpose, so the alternative is not testing the recovery path at all.
#
# It is a feature rather than `cfg(test)` because the swapchain half of recovery can only be
# tested from a crate that is allowed to own a window, which the core is not (§3.1). Under
# resolver 2 a feature enabled by a dev-dependency does not reach a plain `cargo build`, so the
# shipped binary does not carry the hook.
test-hooks = []

[dependencies]
# `SPEC.md` §5.6's resolution order. Both are pure Rust with no C toolchain, which §5.3's
# zero-C-dependency position requires, and both are Apache-2.0 OR MIT under `deny.toml`.
# Neither covers UTF-16 or UTF-32 *detection*, and encoding_rs does not decode UTF-32 at all —
# the WHATWG Encoding Standard excludes it — so `encoding` owns those two directly.
encoding_rs = "0.8"
chardetng = "0.1"

# `SPEC.md` §3.3's cell model: the unit is the grapheme cluster (UAX #29) and East Asian Wide and
# Fullwidth clusters take two cells. Both are pure Rust with no C toolchain, and both are
# Apache-2.0 OR MIT under `deny.toml`. Hand-rolling either means shipping — and ageing — a copy of
# the Unicode character database, which is the opposite of a maintainable position.
unicode-segmentation = "1"
unicode-width = "0.2"

# `SPEC.md` §7.4 names the engine: "the Rust `regex` crate. Lazy DFA, rare-byte memchr prefilters,
# Teddy SIMD multi-pattern -- the same tricks klogg imports Hyperscan for, with no Boost/Ragel/C++
# dependency." §7.2's `/pattern/` predicate is the first caller. Pure Rust, no C toolchain, and
# MIT OR Apache-2.0 under `deny.toml`.
#
# `unicode` is on because a log line is not ASCII and `\w` must mean what a reader expects; `perf`
# is on because §7.4's whole argument for this crate is the lazy DFA and the prefilters.
#
# It pulls in `aho-corasick` and `memchr`, both `Unlicense OR MIT`. `deny.toml` does not allow
# Unlicense and does not need to: an SPDX `OR` is satisfied by either branch and MIT is allowed.
# Noted here because "Unlicense" appearing in the tree looks like a problem and is not.
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf"] }

# §7.4's escape hatch: "Log4net and NLog users write `(?<!DEBUG).*Exception` routinely, so
# rejecting lookaround outright would look broken -- but an unbounded backtracking engine over a
# 500 KB serialised-object line is the exact hang class klogg is criticised for (#803)." So
# lookaround and backreferences go to a backtracking engine with an explicit backtrack_limit and a
# hard per-line input cap, and everything else stays on the linear-time one above. MIT.
fancy-regex = "0.14"

# The leaf backends are modules here rather than separate crates. `SPEC.md` §3.1 puts them inside
# the core, and splitting them into crates buys nothing until a second platform exists — at which
# point the split is a mechanical move, not a redesign.
# `#[implement]` expands to paths rooted at `::windows_core`, so the crate `windows` re-exports as
# `windows::core` has to be a direct dependency under its own name as well. Same crate, same
# version — `windows` 0.58 depends on exactly this — so it adds nothing to the build but a name.
[target.'cfg(windows)'.dependencies.windows-core]
version = "0.58"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    # `SPEC.md` §3.3's shaping needs `IDWriteTextAnalyzer::AnalyzeScript`, which does not return its
    # result — it calls back into an `IDWriteTextAnalysisSource` we supply for the text and an
    # `IDWriteTextAnalysisSink` we supply for the runs. Authoring a COM object in Rust is what this
    # feature is for; there is no way to shape without it.
    "implement",
    "Win32_Foundation",
    "Win32_Globalization",
    # CreateFileW and CreateEventW both take a SECURITY_ATTRIBUTES pointer, so their bindings are
    # gated behind this. Most calls pass None; `SPEC.md` §13.2's spill file does not — it builds a
    # protected DACL from the calling user's SID, which needs the token and SDDL APIs below.
    "Win32_Security",
    "Win32_Security_Authorization",
    # GetStdHandle, for §4.2's `GetFileType(GetStdHandle(STD_INPUT_HANDLE))`.
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
