[package]
name = "tailhawk-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# The leaf backends are modules here rather than separate crates. `SPEC.md` §3.1 puts them inside
# the core, and splitting them into crates buys nothing until a second platform exists — at which
# point the split is a mechanical move, not a redesign.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
