[package]
name = "tailhawk-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `SPEC.md` §5.6's resolution order. Both are pure Rust with no C toolchain, which §5.3's
# zero-C-dependency position requires, and both are Apache-2.0 OR MIT under `cargo-deny.toml`.
# Neither covers UTF-16 or UTF-32 *detection*, and encoding_rs does not decode UTF-32 at all —
# the WHATWG Encoding Standard excludes it — so `encoding` owns those two directly.
encoding_rs = "0.8"
chardetng = "0.1"

# The leaf backends are modules here rather than separate crates. `SPEC.md` §3.1 puts them inside
# the core, and splitting them into crates buys nothing until a second platform exists — at which
# point the split is a mechanical move, not a redesign.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
]
