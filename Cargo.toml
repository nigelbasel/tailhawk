[workspace]
resolver = "2"
members = [
    "experiments/g3-d2d",
    "experiments/g3-d3d11",
    "experiments/g4-glyph-atlas",
    "experiments/g4b-batched-raster",
    "experiments/g7-egui-scroll",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
strip = true
codegen-units = 1
