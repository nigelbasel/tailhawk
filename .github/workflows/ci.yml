name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # SPEC.md §2: copy-and-run on a machine with no runtime installed. The dynamic build imports
  # vcruntime140.dll and the CRT api-sets; the static one imports only OS DLLs, so the shipped
  # artefact is always static.
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  # CLEANROOM.md §7 leans on cargo-deny for the half of provenance a clean-room process cannot
  # cover: a copyleft crate arriving transitively. Until M1 the only dependency was `windows` and
  # nothing ran the config, so the allow-list was documentation rather than a gate.
  #
  # Runs on Linux and once only. deny.toml pins the target triple itself, so the dependency
  # graph it resolves is the Windows one regardless of which runner asks.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # CLEANROOM.md §1.5 — "the §5 entry for a component is written and committed *before* the first
  # line of that component". That rule has slipped four times, and each slip was found by a later
  # review rather than by the process. HANDOFF.md's own traps table records why: "a config file
  # nothing executes is documentation", and §1.5 was documentation.
  #
  # This asserts only the weakest mechanical form of it — that every shipped module is *named*
  # somewhere in CLEANROOM.md. It cannot check that the entry came first, that it is accurate, or
  # that it is honest; a human still has to read it. What it does catch is the failure that has
  # actually happened every time: a new module arriving with no entry at all.
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every core module is named in CLEANROOM.md
        shell: bash
        run: |
          missing=()
          for f in crates/tailhawk-core/src/*.rs; do
            n=$(basename "$f")
            # lib.rs is the crate root, not a component: it declares modules and re-exports them.
            [ "$n" = "lib.rs" ] && continue
            grep -qF -- "$n" CLEANROOM.md || missing+=("$n")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "CLEANROOM.md §5 names no entry for: ${missing[*]}"
            echo "Add the entry before the code, per §1.5 — not after this gate fails."
            exit 1
          fi
          echo "every core module is named in CLEANROOM.md"

  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: aarch64-pc-windows-msvc
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel and both targets, so rustup resolves this with no
      # version named here.
      - name: Show toolchain
        run: |
          rustup show
          rustc --version --verbose

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build
        run: cargo build --release --workspace --target ${{ matrix.target }}

      # Host-only: the runner cannot execute an ARM64 binary, and clippy/tests are
      # architecture-independent, so running them once on x64 is sufficient.
      # Product crates only, for the same reason as the format check. The experiments are still
      # compiled by the workspace build above, so they cannot rot into not building — they just do
      # not have to satisfy lints written after they were finished.
      - name: Clippy
        if: matrix.arch == 'x64'
        run: cargo clippy --release -p tailhawk -p tailhawk-core --target ${{ matrix.target }} -- -D warnings

      # Product crates only. The experiment crates under experiments/ are throwaway measurement
      # code whose hand-formatting is part of what they record; reformatting them would churn
      # files kept for their history, not their style.
      - name: Format
        if: matrix.arch == 'x64'
        run: cargo fmt -p tailhawk -p tailhawk-core -- --check

      # --nocapture because several tests need a D3D11 device, a window station or an installed
      # font, and skip loudly rather than fail when the runner has none. Without it cargo captures
      # the output of passing tests, so a skip and a real run are indistinguishable in the log and
      # a skipped device test reads as a green one. The skip messages are the only evidence either
      # way, so they have to reach the log.
      - name: Test
        if: matrix.arch == 'x64'
        run: cargo test --release --workspace --target ${{ matrix.target }} -- --nocapture

      # PLAN.md M0: an x64 and ARM64 exe under the size gate. The 15 MB gate is from SPEC.md §11.2;
      # G3 measured the skeleton at ~250 KB, so this is an alarm for accidental bloat — a jump of
      # two orders of magnitude means something large was linked in by mistake.
      - name: Size gate
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/tailhawk.exe"
          $bytes = (Get-Item $exe).Length
          $limit = 15MB
          "tailhawk.exe (${{ matrix.arch }}): $bytes bytes, gate $limit"
          if ($bytes -gt $limit) { throw "size gate exceeded: $bytes > $limit" }

      # SPEC.md §3.2 requires shaders compiled offline with the bytecode embedded. A runtime
      # D3DCompile would add a d3dcompiler_47.dll import, which is redistributable-only. Import
      # names are stored as plain ASCII, so absence of the string proves absence of the import.
      - name: Assert no runtime shader compiler
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/tailhawk.exe"
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          if ($ascii -match 'd3dcompiler') { throw "d3dcompiler is imported - a shader is being compiled at runtime" }
          "no d3dcompiler import"

      # SPEC.md §13.2 has claimed since 2026-07 that "no outbound connection of any kind" is a
      # "testable assertion in CI". Until now it was not tested at all - it was true only because
      # no HTTP code had ever been written, and construction is not a guarantee. This is the test.
      #
      # A process cannot open a socket without one of these DLLs, and import names are stored as
      # plain ASCII, so the absence of the string is the absence of the capability.
      #
      # $allowed is the policy, and it is deliberately a list rather than a condition. LOKI.md
      # stages a Loki source built on WinHTTP; the day it lands, winhttp.dll belongs here and the
      # diff that adds it is a visible, reviewable change to the privacy claim rather than a
      # silent one. Two rules govern that edit, and neither is optional:
      #
      #   1. Nothing is added to $allowed until SPEC.md §13.2's wording is amended in the same
      #      commit to describe what the binary may now do.
      #   2. Adding a transport here weakens this step from proof to permission, so it must be
      #      paired with the behavioural half: WinHTTP is loaded lazily, on the first use of an
      #      explicitly configured remote source, and CI asserts that a run over a local file
      #      leaves winhttp.dll absent from the process module list. That is what keeps the
      #      *conditional* form of the claim - "unless the user explicitly opens a remote source"
      #      - checkable rather than merely asserted.
      # $control is the positive control, and without one this step is worth very little. A scan
      # that found nothing because its regex was wrong, or because it read the wrong encoding, would
      # report "zero network" for ever and look exactly like a scan that found nothing because there
      # is nothing to find. uxtheme.dll is reached through LoadLibraryW rather than the import table
      # - so proving the scan sees *it* proves the scan can see a dynamically loaded transport too,
      # which is the only kind a socket would arrive by now that the import table is checked.
      - name: Assert no network capability
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/tailhawk.exe"
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $dlls = [regex]::Matches($ascii, '[A-Za-z0-9_\-\.]+\.dll') | ForEach-Object { $_.Value.ToLower() } | Sort-Object -Unique
          $control = 'uxtheme.dll'
          if (-not ($dlls -match [regex]::Escape($control))) {
            throw "the scan cannot see $control, which this binary certainly loads - it is reading the wrong thing, and its 'no transport' answer means nothing"
          }
          "positive control: the scan sees $control, which is loaded dynamically rather than imported"
          $transports = 'winhttp|wininet|urlmon|ws2_32|wsock32|mswsock|winsock|dnsapi|httpapi|webservices|winnetwk'
          $allowed = @()
          $found = $dlls | Where-Object { $_ -match $transports } | Where-Object { $allowed -notcontains $_ }
          if ($found) { throw "SPEC.md 13.2: binary can open a network connection via $($found -join ', ')" }
          if ($allowed.Count -eq 0) { "zero network: no transport DLL is imported at all" }
          else { "network capability limited to the reviewed allow-list: $($allowed -join ', ')" }

      # SPEC.md §2's copy-and-run promise. The static build must name only OS DLLs; an import of
      # vcruntime140.dll or the CRT api-sets means it needs a redistributable installed.
      - name: Assert no CRT redistributable dependency
        shell: pwsh
        run: |
          $exe = "target/${{ matrix.target }}/release/tailhawk.exe"
          $ascii = [Text.Encoding]::ASCII.GetString([IO.File]::ReadAllBytes($exe))
          $dlls = [regex]::Matches($ascii, '[A-Za-z0-9_\-\.]+\.dll') | ForEach-Object { $_.Value.ToLower() } | Sort-Object -Unique
          "imports: $($dlls -join ', ')"
          $banned = $dlls | Where-Object { $_ -match 'vcruntime|msvcp|api-ms-win-crt' }
          if ($banned) { throw "needs a CRT redistributable: $($banned -join ', ')" }
          "static CRT confirmed"

      # Unsigned: the code-signing route is still open (PLAN.md §7.1 - Azure Artifact Signing is
      # ruled out on geographic eligibility, Certum unconfirmed). Shipping unsigned is a legitimate
      # v1 posture, so this is the placeholder the M0 criterion asks for.
      - uses: actions/upload-artifact@v4
        with:
          name: tailhawk-${{ matrix.arch }}-unsigned
          path: target/${{ matrix.target }}/release/tailhawk.exe
          if-no-files-found: error
